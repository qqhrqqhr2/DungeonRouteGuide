name: Release
on:
  push:
    tags:
      - 'v*'
    # A new "## vX.Y.Z" heading at the top of CHANGELOG.md on main releases
    # that version: the job creates the tag itself, then packages.
    branches:
      - main
    paths:
      - CHANGELOG.md
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the CHANGELOG version
        id: tag
        if: github.ref_type == 'branch'
        run: |
          ver=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -c4-)
          if [ -z "$ver" ]; then echo "No version heading in CHANGELOG.md"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git rev-parse -q --verify "refs/tags/$ver" >/dev/null; then
            echo "$ver already released"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$ver" -m "$ver"
          git push origin "$ver"
          echo "Tagged $ver"
      - uses: BigWigsMods/packager@v2
        if: steps.tag.outputs.skip != 'true'
